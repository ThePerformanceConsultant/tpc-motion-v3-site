<h1>How to ALWAYS achieve your goals (even when time isn&#39;t on your side)</h1>
<p>Will Dyson · <time datetime="2026-05-16T10:34:20.222Z">16 May 2026</time></p>
<p>The problem with a lot of coaching programs or social media outlooks is that they&#39;re not practical.

It&#39;s difficult balancing things with a real job, kids, etc. - I&#39;ve done this for 10 years going through my BSc, MSc, PhD while competing in bodybuilding, BJJ, doing CrossFit etc. and balancing my ...</p>
<figure><img src="https://cdn.sanity.io/images/stkjtr6l/production/b1c861d7b59aa8b204d447e2527b4b19a2d414e4-1790x1156.webp?w=1280&amp;auto=format&amp;q=75&amp;fit=max" alt="Original cover for How to ALWAYS achieve your goals (even when time isn&#39;t on your side)" loading="lazy" style="max-width:100%;height:auto" /></figure>
<h2 id="the-problem-with-a-lot-of-coaching-programs-or-social-media-outlooks-is-that-they-re-not-practical">The problem with a lot of coaching programs or social media outlooks is that they&#39;re not practical.</h2>
<p>It&#39;s <em>difficult</em> <strong>balancing</strong> things with a real job, kids, etc. - I&#39;ve done this for 10 years going through my BSc, MSc, PhD while competing in bodybuilding, BJJ, doing CrossFit etc. and balancing my coaching business. And they&#39;re all (mostly) relatable things, <em>and</em> I have the skillset to make things relatively automatic.</p>
<p>And it&#39;s <em>still</em> tough when I get to the end of the day and I don&#39;t want to do what&#39;s scheduled sometimes, or don&#39;t want to do it beforehand for fear of how it might impact the rest of the day.</p>
<p><strong>The</strong> most impactful habit you can adopt is <strong>being organised</strong>, and not in the way that you&#39;re probably used to...</p>
<p>Thinking about the week ahead on a Sunday and planning out your week in advance - not day by day but thinking <em>&quot;with everything else I have going on, what am I most likely going to be able to get done by the end of the week?”</em>.</p>
<p>Start by putting your <strong>non-negotiables</strong> into your calendar (I use <strong>Google Calendar</strong>) - work, travel, meetings, food shop, kids etc.</p>
<p>Set your <strong>boundaries</strong> - bed and wake times (as <strong>7-8 hours/night</strong> is <em>non-negotiable</em>), an hour to wind down in the evening, 30 minutes to get your shit together in the morning and check your schedule etc.</p>
<p>This should form the basis for a <strong>“realistic outlook”</strong> of your week.</p>
<p><strong>IF</strong> you end up consistently falling short of time to exercise, either you’re not being pragmatic enough with your time, or you need to reassess your lifestyle priorities as, to be frank, looking after your health and fitness <strong>isn’t up for discussion</strong>. If you decide to not make time for your body, it will respond appropriately with a middle finger in the years to come. That is not a threat, but a <em>cold certainty</em> - and that’s on you.</p>
<p>Accordingly, next, <strong>define your health and fitness goals</strong>. This is <em>essential</em> if you&#39;re going to be able to take meaningful action. For example, mine are strength, fitness, (maintaining my) physique, olympic lifting, BJJ - bearing in mind that I&#39;m a fitness professional; don&#39;t pick too many! Now we know <strong>what</strong> we&#39;re trying to contribute to.</p>
<p>If the week looks busy, tough, or I&#39;m already feeling a bit on the back foot, I&#39;ve learned over time that the way to tackle this isn&#39;t to spend ages creating <em>&quot;the perfect plan&quot;</em> (looking at you, fellow ADHD&#39;ers), but instead to decide <em>&quot;what are my minimum effective contributions that I need to make to keep the needle moving with each goal?&quot;</em>. Many of you will notice that I do this automatically when you have a week where you know what hits the fan, as if your <em>only</em> positive outcome is perfection, you are <strong>setting yourself up for failure</strong>.</p>
<h2 id="here-s-an-example-of-how-i-handle-my-own-goals">Here&#39;s an example of how I handle my own goals:</h2>
<p><strong>Fitness</strong> - 2-3 hours of Z2, 15-30 mins Z4, 5-10 mins Z5. If it&#39;s a tough week, Z2 is most important, then Z4, then Z5. I can count Z3 as Z2 if I need to. At least one session needs to be a run.</p>
<p><strong>Strength</strong> - 8 sets of Squats, Pull Ups, Bench and Hip Hinge (e.g. Deadlift/GHR).</p>
<p><strong>Olympic Lifting</strong> - 3 sessions prescribed by my coach, one of which is accessory work. If it&#39;s a tough week, split (most of) the accessory work between the other two sessions. If it&#39;s a nuclear week, leave the accessory work and get the skill work done as that&#39;s most important.</p>
<p><strong>BJJ</strong> - 2-3 sessions. Wednesday AM and Sunday AM at a minimum.</p>
<p>Once I have this <em>&quot;checklist&quot;</em>, if the week gets ahead of me, I can then whittle away at these piece by piece as I&#39;ve set my lifestyle up to be able to do that.</p>
<p><strong>Fitness</strong> - I have an exercise bike and a pair of running trainers.</p>
<p><strong>Strength</strong> - I have a barbell, weights, and a pull-up bar.</p>
<p><strong>Olympic Lifting</strong> - see above, but also a gym membership. Well, three technically, but let&#39;s not remind my bank balance of that...</p>
<p>There have been times during writing my PhD thesis where it’s literally been a case of waking up, doing a 5k run in the garage, then jumping off every 200 m during 2K cool down to get some sets of pull-ups or ring dips in - 40 minutes and I’ve put away 4 sets of each and got a chunk of fitness work done.</p>
<p>I can do this as I&#39;ve made those small investments in a home setup that mean I have backstops available. It started with a secondhand bike from FB Marketplace (£100), a £40 pair of trainers, and a cheap doorway pull-up bar from Amazon (I used to do dips instead of bench on the corner of the kitchen counters). Many of you are well aware that I&#39;ve since invested about £10 000 into a home gym that&#39;s grown and grown but the reality is, none of that is necessary to keep the needle moving but there&#39;s an important lesson herein...</p>
<p>I took putting a price on my body and health off the table.</p>
<p>You have <strong>one</strong> body, and if I have to put a little away to ensure I look after it, it&#39;s a <em>tiny</em> price to pay for it letting me enjoy all the other fun things I like to do in life.</p>
<p>Don&#39;t overcomplicate it, the simpler your backup plan is, the more likely you are to do it; and the more likely you are to <strong>always</strong> have successful weeks.</p>
