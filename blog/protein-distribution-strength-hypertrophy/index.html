<h1>Protein Distribution: What&#39;s Important for Strength and Hypertrophy</h1>
<p>Will Dyson · <time datetime="2026-07-17T08:18:29.305Z">17 July 2026</time></p>
<p>A practical, evidence based framework for setting daily protein intake and distributing it across meals without making nutrition unnecessarily complicated.</p>
<figure><img src="https://cdn.sanity.io/images/stkjtr6l/production/87c9f8d439dac00f58668cba51a8d5fbda4b5ba9-2160x3840.png?w=1280&amp;auto=format&amp;q=75&amp;fit=max" alt="Will Dyson explaining a performance nutrition concept at a desk." loading="lazy" style="max-width:100%;height:auto" /></figure>
<p>Protein receives a disproportionate amount of attention these days... And although for the better - I&#39;d far rather we be here than when saying the word &quot;protein&quot; was near synonymous with steroids - there&#39;s still a lot of context and balance to be learned, starting with <strong>timing</strong>. For most people, the first priority is still the <u><strong>total</strong></u><strong> amount</strong> of high quality protein consumed across the day, wherein distribution and timing needn&#39;t even be mentioned until after that daily target is consistently met.</p>
<h2 id="start-with-the-daily-target">Start with the daily target</h2>
<p>Most studies (such as this large <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5867436/">meta-analysis</a>) consistently conclude that the lion&#39;s share of the benefit the average active individual can reap from protein for muscle growth and recovery sits at around <strong>1.6-2 g protein per kg of body mass per day</strong>. There are other other factors such as energy restriction (i.e. a caloric deficit), very high training volumes, food preference and individual tolerance which can/may justify a higher target, however.</p>
<aside><p><strong>Practical starting point: Daily intake &gt; per meal optimisation</strong></p><p>For an 80 kg athlete, 2 g/kg provides 160 g of protein per day. Establishing that intake consistently is likely far more important than whether each meal contains precisely 40 g.</p></aside>
<h2 id="then-work-on-precision">Then work on precision</h2>
<p>Once your daily total is secure and <em>consistent</em>, dividing protein across <strong>three to five meals/snacks</strong> is the next sensible approach. A practical target is approximately <strong>0.3 to 0.5 g/kg per meal</strong>. Four meals at 0.5 g/kg would provide 2.0 g/kg across the day while giving each meal enough protein to (near) maximally stimulate muscle protein synthesis (the process that drives muscle growth and recovery) in most adults.</p>
<figure><table><thead><tr><th scope="col">Body mass</th><th scope="col">Per meal</th><th scope="col">Four-meal total</th></tr></thead><tbody><tr><td>60 kg</td><td>24 g</td><td>96 g</td></tr><tr><td>80 kg</td><td>32 g</td><td>128 g</td></tr><tr><td>100 kg</td><td>40 g</td><td>160 g</td></tr></tbody></table><figcaption>Example protein distribution using four meals at approximately 0.4 g/kg per meal.</figcaption></figure>
<p>The &quot;classical&quot; belief is that protein synthesis is maximally stimulated at 40 g/meal however, for academic reasons that would involve me trailing you through 12 years of history since the pivotal - and excellent - work of <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3650697/">Areta and colleagues</a>, there is a little more nuance and freedom than it might otherwise suggest. For instance, other recent work by <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10772463/">Trommelen et al.</a> that showed increased and near proportionate responses to single servings of protein as high as 100 g per meal when compared to 25 g per meal. </p>
<figure><img src="https://cdn.sanity.io/images/stkjtr6l/production/21a667c4dacd4dc2c30e78ad9c1918ea7141fa11-664x664.jpg?w=664&amp;auto=format&amp;q=75&amp;fit=max" alt="Graphical abstract from Trommelen et al. (2023)." loading="lazy" style="max-width:100%;height:auto" /><figcaption>Graphical abstract from Trommelen et al. (2023).</figcaption></figure>
<h2 id="post-workout-protein-isn-t-special">Post workout protein isn&#39;t special</h2>
<p>The concept of there being a heightened narrow window of responsiveness to protein is often referred to as &quot;<strong>the anabolic window</strong>&quot;. This has caused many to believe that they <em>must</em> ingest protein rapidly immediately following training, else they remain fools that have missed out on this golden opportunity for gains! However, fortunately, this is a myth, with no evidence to support any significant benefit of rapid protein ingestion post-exercise when total daily protein requirements are equated. </p>
<p>The reality is that resistance training increases the muscle response to protein for <strong>many</strong> hours, so there is <u><strong>no</strong></u> need to treat the post workout window as a blue light emergency as some would have you believe... A protein containing meal within a few hours before or after training is generally sufficient, provided that total daily intake is appropriate.</p>
<blockquote><p>Protein distribution should make the daily target easier to achieve, not make eating more complicated.</p><footer>The Performance Consultant</footer></blockquote>
<h2 id="application-without-overengineering">Application without overengineering</h2>
<ol><li>Choose a daily target based on your bodyweight. </li><li>Divide it between the number of meals you can repeat sustainably (for most, that&#39;s 3 squares (Breakfast, Lunch and Dinner) and 1-2 snacks. </li><li>Anchor each meal with good quality protein sources (e.g. chicken, fish, tofu, seitan, high protein dairy etc.) that you enjoy.</li></ol>
<p>Remember - a plan is only worth following when it&#39;s practical in the face of work, family life, busy training weeks etc. The objective is a <em>broadly</em> repeatable structure with enough flexibility to stay <em>relatively</em> accurate when circumstances change.</p>
