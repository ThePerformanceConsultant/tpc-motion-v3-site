<h1>Sweet Controls Sour and Bitter</h1>
<p>Will Dyson · <time datetime="2026-07-19T07:00:00.000Z">19 July 2026</time></p>
<p>How sweetness helps control and balance sour and bitter flavours in the foods we eat</p>
<figure><img src="https://cdn.sanity.io/images/stkjtr6l/production/832cd71c0b4ed5f5837a356eeb089c7f37648ff8-1080x1620.jpg?w=1080&amp;auto=format&amp;q=75&amp;fit=max" alt="jerk chicken with mango, lime and pepper salsa" loading="lazy" style="max-width:100%;height:auto" /><figcaption>sweet mango and red peppers balance the sour and bitter of lime and green peppers</figcaption></figure>
<h2 id="sweetness-as-a-culinary-tool"><strong>Sweetness as a culinary tool</strong></h2>
<p>Sweetness carries an unusual amount of &quot;baggage&quot; in fitness culture... Sweet foods are often associated with rewards, &quot;cheat meals&quot;, weakness or evidence of poor discipline, making it difficult to use sweetness <em>intelligently</em>. People either remove it completely or consume it reactively after several days of trying not to think about it which, if you&#39;re a client of mine, will know is the complete opposite of what we want to do if we like a food or flavour.</p>
<p>Sweetness is simply one component of flavour. </p>
<p>It can make fruit, yogurt and oats more satisfying...</p>
<p> It can soften the acidity of tomatoes...</p>
<p>Balance the bitterness of cocoa...</p>
<p>Moderate an aggressive chilli sauce....</p>
<p>Used carefully, it can improve a savoury recipe without making the finished meal taste conventionally sweet.</p>
<h2 id="what-creates-sweet-taste"><strong>What creates sweet taste?</strong></h2>
<p>Human sweet taste is principally associated with the <strong>T1R2/T1R3 receptor complex</strong>, which responds to sugars and a range of other sweet-tasting compounds. Sweetness is therefore associated with carbohydrate and energy, but it is <em>not</em> a direct or quantifiable measurement of either. For instance, starches such as rice, oats, bread and potatoes provide carbohydrate without tasting intensely sweet, while berries and non-nutritive sweeteners provide sweetness with little or no energy.</p>
<p>This is important for athletes. Despite the cacophony of self-proclaimed social media &quot;experts&quot; proclaiming that your cravings are directly linked to nutritional deficiencies, a craving for sweet food cannot tell you <em>how much</em> <strong>glycogen</strong> is present in your muscle; nor is a sweet-tasting food an automatically effective recovery meal. Conversely, the presence of <strong>sugar</strong> does not make a food nutritionally inappropriate. </p>
<p>A brief rant on the <em>&quot;evils&quot; of sugar</em>... </p>
<p>It pains me to no end to say that last week I waited 5 minutes to grab my protein yogurts from Aldi because two people were deliberating whether or not the 3-4 grams of sugar per 100 g in a protein yogurt was worth it for what is an excellent food choice. I&#39;m confident that, given there were other much higher calorie, sugar-containing and more obesigenic ingredients in their trolley that their reasons were not medical (i.e. diabetes), and while I have no doubt that they are health-conscious and well-intentioned; it was poignant reminder of just how far social media has (wrongly) influenced our behaviours. Without going too off piste, just because a food has sugars included in it does not make it &quot;unhealthy&quot;.</p>
<p>Carbohydrate availability (how much glycogen we have) remains relevant to training <strong>performance</strong> and <strong>recovery</strong>, particularly when training volume or intensity is high. The required amount depends on the athlete, the session and the broader programme, where sweetness is one potential delivery format, not the physiological target itself.</p>
<h2 id="ingredients-that-contribute-sweetness"><strong>Ingredients that contribute sweetness</strong></h2>
<p>Obvious sources include sugar, honey, maple syrup, syrups and sweeteners. Plenty of minimally processed foods also provide useful sweetness:</p>
<ul><li>Ripe bananas, mangoes, grapes, apples and stone fruits</li><li>Berries and cooked fruit</li><li>Dates, raisins and other dried fruit</li><li>Milk and yoghurt through lactose</li><li>Sweet potatoes, carrots, squash, peas and sweetcorn</li><li>Onions and garlic, particularly after browning or slow cooking</li><li>Tomato products, which contain both sweetness and acidity</li></ul>
<p>Cooking can concentrate water-soluble sugars and generate caramelised or roasted aromas which add additional and unique flavour bonus points, demonstrating the versatility of sweet foods. This is why roasted carrots and slowly cooked onions taste markedly sweeter than their raw equivalents, even when no sugar has been added.</p>
<h2 id="sweetness-as-balance"><strong>Sweetness as balance</strong></h2>
<p>Sweetness is especially useful in meals dominated by bitterness or acidity.</p>
<p>Cocoa, coffee, certain protein powders and some high-protein yoghurts can produce a <strong>bitter</strong> or astringent finish. Berries add <strong>acidity</strong>. Combining all of these in one bowl can create an impressive nutritional label but an unpleasant breakfast.</p>
<p>A small amount of sweetness - such as via a drizzle of honey or a ripe banana - suppresses some of the harshness, mellowing the bitter and sour/acidic tones, helping the dish come together. The required quantity is often modest because the objective is <em>balance</em> rather than dessert-level sweetness. Additionally, taste-mixture research shows that sweetness can be a strong suppressor of other taste qualities, although the size of the effect depends on concentration and context.</p>
<p>Sweetness can also improve <strong>savoury</strong> food:</p>
<ul><li>A small amount of honey can round a sharp mustard dressing.</li><li>Sugar can soften an excessively acidic tomato sauce (think ketchup).</li><li>Mango or pineapple can balance chilli heat or salty soy sauce (think jerk chicken and mango).</li><li>Roasted squash can provide contrast in a bitter kale salad.</li><li>A little maple syrup can make miso-coated vegetables substantially more appealing.</li></ul>
<p>The &quot;correct&quot; <em>amount</em> often is often imperceptible, where you should notice that the meal tastes more <strong>complete</strong>, rather than identifying sugar as a dominant flavour.</p>
<h2 id="coaching-case-study-if-your-protein-bowl-tastes-too-healthy"><strong>Coaching case study: if your protein bowl tastes “too healthy”</strong></h2>
<p>A client combined low fat Greek yogurt, chocolate whey, cocoa powder, oats and frozen raspberries.</p>
<p>On paper, it was an efficient and nutritionally excellent breakfast, but In practice, it tasted sour, bitter and chalky. The client assumed the problem was the yogurt and began looking for a more processed protein snack.</p>
<p>The problem was the <strong>balance</strong>.</p>
<p>The revised bowl used ripe banana for <em>sweetness</em>, a pinch of salt to soften the cocoa’s <em>bitterness</em> and enough oats or cereal to provide contrast in <em>texture,</em> with an optional 5-10 grams of honey available as an adjustable finish in case more sweetness was needed to moderate.</p>
<p>The breakfast now contained sweetness from fruit, sourness from yogurt and berries, bitterness from cocoa, salt in a supporting role and some savoury depth from the dairy protein.</p>
<h2 id="example-recipe-cocoa-cherry-recovery-bowl"><strong>Example Recipe: Cocoa Cherry Recovery Bowl</strong></h2>
<p><strong>Makes one decent serving</strong></p>
<h3 id="ingredients"><strong>Ingredients</strong></h3>
<ul><li>250 g fat free Greek yogurt or Skyr</li><li>20-30 g Chocolate or Vanilla Protein Powder</li><li>40-60 g Oats, Cereal or Granola (<em>scaled to training demand</em>)</li><li>100 g Cherries or Berries</li><li>½ ripe Banana (<em>mashed</em>)</li><li>1 tsp Cocoa Powder</li><li>A small pinch of Salt</li><li>Cinnamon</li><li>1 tsp Honey or Maple Syrup (<em>optional</em>)</li></ul>
<h3 id="method"><strong>Method</strong></h3>
<ol><li>Mix the yogurt, protein powder, mashed banana, cocoa and salt.</li><li>Taste before adding further sweetness.</li><li>Add the fruit and oats or cereal.</li><li>Use honey or maple syrup to moderate if the bowl tastes too sour or bitter.</li><li>*If it becomes cloying, add more berries, a spoonful of plain yoghurt or a small amount of cocoa.</li><li>For post-training use, scale the oats, cereal, fruit or honey according to needs.</li></ol>
<p><em>*I would encourage you to at least once play around with making the dish too sour... neutralise with sweetness... take it to too sweet... neutralise with sour... etc. so you gain an appreciation for how to moderate and use flavour effectively</em> </p>
<p>The banana provides sweetness and body. Salt reduces <strong>bitterness</strong>. Cherries or berries supply <strong>acidity</strong>. Cocoa contributes <strong>bitterness</strong> and roasted aroma. The result has contrast rather than relying on sweetness alone - something many would assume just by reading the title.</p>
<h2 id="what-does-a-sweet-craving-mean"><strong>What does a sweet craving mean?</strong></h2>
<p>Sweet cravings are often interpreted too confidently.</p>
<p>They are sometimes presented as proof of magnesium deficiency, chromium deficiency, low glycogen or “sugar addiction”, when the evidence-based reality is incredibly consistent in that a craving <strong><u>cannot</u></strong> diagnose any of these conditions. In fact, the <u><strong>only</strong></u> taste we have a physiologically pre-disposed sensitivity to in this sense is <strong>salt</strong>, due to its role in cardiovascular function.</p>
<p>On the other hand, <strong>acute sleep restriction</strong> <em>can</em> alter hunger and food reward. In one controlled <a href="https://pubmed.ncbi.nlm.nih.gov/26467988/">study</a>, sleep restriction increased <strong>ghrelin</strong> and snack intake, with much of the additional energy coming from carbohydrate-rich foods. Other experimental work indicates that caloric deprivation can heighten attention and reward responses to food cues.</p>
<blockquote><p>Ghrelin is a peptide hormone produced mainly by the stomach that stimulates appetite, increases food intake, and promotes fat storage. Widely known as the &quot;hunger hormone,&quot; its levels surge when your stomach is empty to signal your brain it&#39;s time to eat, and drop after a meal.</p></blockquote>
<p>That does not mean <em>every</em> craving is caused by poor sleep or under fuelling. <a href="https://pubmed.ncbi.nlm.nih.gov/16493129/">Longer dietary interventions</a> sometimes even show reductions in food cravings during energy restriction, illustrating that the response is not uniform. Food accessibility, learned habits, dietary rules and repeated exposures are further examples of other non-nutritional factors that contribute to sweet cravings.</p>
<p>When sweet cravings become persistent, we assess the broader pattern:</p>
<ul><li>Is total energy intake appropriate for the <em>training output</em>?</li><li>Are carbohydrate-rich foods concentrated into a <em>narrow part</em> of the day?</li><li>Are meals being <em>skipped</em> during busy work days?</li><li>Is the <em>post-training</em> meal sufficiently large if exercise is a significant hunger driver?</li><li>Has <em>sleep</em> been poor?</li><li>Have sweet foods been <em>labelled</em> completely off-limits?</li><li>Is the craving occurring at a <em>repeated time and location</em>, regardless of hunger?</li></ul>
<p><strong>Repeated exposure</strong> also influences perception. In a <a href="https://drive.google.com/file/d/1iYZnGLX_OuW7x5o6ZowS3iI7oeqCpx5z/view?usp=sharing">five-month trial</a>, lowering simple-sugar intake increased perceived sweet <em>intensity</em>, although it did not reliably change <em>pleasantness</em>. The same food can therefore begin to taste sweeter after dietary exposure changes, but preference does not necessarily follow in sync.</p>
<h2 id="sweetness-and-sustainable-nutrition"><strong>Sweetness and sustainable nutrition</strong></h2>
<p>Learning to use sweetness removes the false dichotomy between joyless food and uncontrolled indulgence.</p>
<p>An intentional amount of sugar, honey or ripe fruit can save a high protein breakfast, increase vegetable intake and make a lower calorie sauce substantially more satisfying. Its contribution should be judged in the context of the meal and the full diet, as opposed to being inherently &quot;good&quot; or &quot;bad&quot;.</p>
<p>Performance nutrition becomes more sustainable when the role of sweetness is understood, enabling more intentional planning and portioning. </p>
<p>Treating it as contraband only makes it more psychologically conflicting. </p>
<p>Whereas, treating it as one adjustable part of flavour facilitates autonomy, self control, and contributes towards that which we all seek... a truly holistic relationship with nutrition.</p>
<p>In the next instalment, we&#39;ll be covering the role of <strong>acidity</strong>.</p>
<p>Coach</p>
