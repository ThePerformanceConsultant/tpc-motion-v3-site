<h1>The Morning After Takeaway Weigh In...</h1>
<p>Will Dyson · <time datetime="2026-06-23T07:11:22.468Z">23 June 2026</time></p>
<p>One of the things that I see time and time and time again is people freaking out over the weight gain after a takeaway...

Obviously this is semi-warranted and understandable, after all, the scales are the most widely used tool used by anyone seeking to manage their body composition.
But the conc...</p>
<figure><img src="https://cdn.sanity.io/images/stkjtr6l/production/73c81c78cc4345a4274544a2888229bd0562400d-1500x1006.jpg?w=1280&amp;auto=format&amp;q=75&amp;fit=max" alt="Original cover for The Morning After Takeaway Weigh In..." loading="lazy" style="max-width:100%;height:auto" /></figure>
<h2 id="one-of-the-things-that-i-see-time-and-time-and-time-again-is-people-freaking-out-over-the-weight-gain-after-a-takeaway">One of the things that I see time and time and time again is people freaking out over the <strong>weight gain</strong> after a <strong>takeaway</strong>...</h2>
<p>Obviously this is semi-warranted and understandable, after all, <strong>the scales</strong> are the most widely used tool used by anyone seeking to manage their body composition.
But the concerning part and the reason I&#39;m writing this is that, this often leads into a spiral of subsequently shitty behaviours which add insult to injury...
I believe the phrase is &quot;<em>throwing the infant out with the basin fluid</em>&quot;
Or something
It was catchy like that &quot;<em>give up the goat</em>&quot; at any rate
Anyway, the point is kicking off a chain of bad behaviours following one <em>&quot;bad&quot;</em> decision.
Now, I&#39;m writing this because I&#39;m about tucking into my second Bibimbap Bowl thanks to Deliveroo&#39;s 50% off
The ingredients are basically about 150 grams of chicken thigh or pork shoulder, some cucumber, some carrots, a fried egg, a teriyaki sauce, and a shit tonne of steamed rice.
Basically - and intentionally - very similar to my usual diet and I just wanted a break from cooking.
<strong>BUT</strong>
I knew from the <em>second</em> I put the spoon - after my usual punitive and futile 5 minutes of fumbling about with chopsticks (God loves a trier) - in my mouth, that my weight is almost guaranteed to jump by probably ~ 2-3 lbs tomorrow (future Will here - he was right, 3.4 lbs up); despite the two bowls being about 500 kCal each.
2-3 lbs of fat mass in calorie money is 8000-12000 kCal... and remember the first law of thermodynamics that makes a calorie deficit &quot;a thing&quot;</p>
<blockquote><p>&quot;Energy cannot be created nor destroyed, only transformed from one form to another&quot;
So <strong>WHY</strong>?
A few things...</p></blockquote>
<ol><li>It&#39;s <strong>salty</strong> AF - there&#39;s a Chinese five spice rub heavily coating the meat and the teriyaki is too</li><li>It&#39;s <strong>21:31</strong> and I&#39;ll be in bed in an hour (pats for me for writing you some sage reflections at this time)</li><li>Did I mention the shit tonne of rice? And two bowls of it?
A big portion of <strong>high volume</strong>, whole foods, high in <strong>salt</strong>, <strong>late</strong> at night</li></ol>
<ul><li>Food weighs stuff... because gravity</li><li>Your stomach stores stuff... and we don&#39;t, fortunately, poop out whatever we eat, as soon as we eat it</li><li>Where salt goes... water follows (fluid retention)
All of those are <strong>NON BODY FAT</strong> related things that can - and will - have a dramatic impact on the scale, <strong>EVEN THOUGH</strong> it is our primary tool for tracking weight loss... which we associated with tracking body fat loss.
So the most important thing you can do... is restart your existing plan, and a little patience ok👌</li></ul>
