<h1>Sour Brightens Salty and Rich</h1>
<p>Will Dyson · <time datetime="2026-10-09T07:00:00.000Z">9 October 2026</time></p>
<p>How acidity brings flat meals to life, balances salt and richness, and why the best place for apple cider vinegar is in your food instead of a misplaced morning &quot;digestion tonic&quot;</p>
<figure><img src="https://cdn.sanity.io/images/stkjtr6l/production/fdd6b2956f6bb54b0680d866ca423897cdda1869-1155x648.webp?w=1155&amp;auto=format&amp;q=75&amp;fit=max" alt="sour fruits" loading="lazy" style="max-width:100%;height:auto" /><figcaption>How acidity brings flat meals to life, balances salt and richness, and why the best place for apple cider vinegar is in your food instead of a misplaced morning &quot;digestion tonic&quot;</figcaption></figure>
<h2 id="acidity-as-a-culinary-tool">Acidity as a culinary tool</h2>
<p>If sweetness carries baggage in fitness culture, acidity carries none at all... which is exactly why it is typically undervalued and ignored. Nobody feels guilty about a squeeze of lime. Nobody posts a &quot;what I eat in a day&quot; video proudly announcing they added a splash of vinegar to their lentils. And yet, when a client tells me their meals taste <em>flat</em>, <em>heavy</em> or <em>&quot;just a bit boring&quot;</em>, none of them reach for a bit of balsamic to bring it back to life. More often than not, the missing ingredient is acid far more often than it is salt, sugar or yet another sauce.</p>
<p><strong>Acidity</strong> is the <em>brightness</em> in food.</p>
<p>It can make a lean chicken breast taste <strong>juicy</strong>...</p>
<p>Make a bowl of rice and beans taste <strong>finished</strong>...</p>
<p><strong>Cut through</strong> overly rich, creamy or cheesy dishes, stopping them from becoming cloying halfway through.</p>
<p>And lift a lower salt, lower fat meal so it doesn&#39;t taste like an overly-healthy compromise...</p>
<p>In <a href="/tpc-motion-v3-site/blog/sweetness/">the last instalment</a> we used sweetness to <em>calm</em> sourness and bitterness down. This time, we are flipping the relationship around and looking at sourness as the ingredient that <strong>wakes</strong> everything else up.</p>
<h2 id="what-creates-sour-taste">What creates sour taste?</h2>
<p>Sour taste is our detector for acids - more specifically, for hydrogen ions (protons). In 2018-2019, a series of studies identified <strong>OTOP1</strong>, a proton channel in a dedicated population of taste cells, as the long-sought sour receptor. When it is removed in mice, the taste nerve response to acids is <em>severely and selectively</em> reduced, and sour signals travel along their own dedicated &quot;line&quot; to the brain (<a href="https://doi.org/10.1126/science.aao3264">Tu et al., 2018</a>; <a href="https://doi.org/10.1016/j.cub.2019.08.077">Teng et al., 2019</a>; <a href="https://doi.org/10.1016/j.cell.2019.08.031">Zhang et al., 2019</a>).</p>
<figure><img src="https://cdn.sanity.io/images/stkjtr6l/production/873a1fdbd655c1b4b3e37ee3b01b70a658352e1c-2241x1434.jpg?w=1280&amp;auto=format&amp;q=75&amp;fit=max" alt="sour taste is perceived upon activation of proton-sensitive OTOP1 receptors via acidic foods" loading="lazy" style="max-width:100%;height:auto" /><figcaption>Sour taste is perceived upon activation of proton-sensitive OTOP1 receptors via acidic foods · Krashes M, Chesler A Acid Tongues Cause Sour Thoughts Cell, 179, 287-289</figcaption></figure>
<p>Here&#39;s the interesting bit for the kitchen: <strong>pH alone does not predict how sour something tastes.</strong> </p>
<aside><p>For those who need a little basic chemistry reminder and/or are still potentially traumatised from school, <strong>acids</strong> have a low pH, <strong>bases</strong> have a high pH. </p></aside>
<p>Weak organic acids - the acetic acid in vinegar, the citric acid in lemons - taste <em>more</em> sour than you would expect from their pH, because the undissociated acid molecules can slip into taste cells and acidify them from the inside. In human taste panels, perceived sourness tracked the <em>total</em> amount of available acid, not just the free protons (<a href="https://doi.org/10.1111/j.1750-3841.2007.00400.x">Da Conceicao Neta et al., 2007</a>).</p>
<p><strong>Translation</strong>: a teaspoon of vinegar and a teaspoon of lemon juice <strong>won&#39;t</strong> behave identically, and different acids bring different &quot;shapes&quot; of sourness: </p>
<p>Examples</p>
<ul><li>The sharp, fast hit of citric acid</li><li>The rounder, lingering tang of lactic acid in yogurt</li><li>The pungent, aromatic edge of vinegar</li></ul>
<p>Choosing between them is a flavour decision rather than a chemistry one (fortunately!).</p>
<aside><p><strong>Evidence quality: A quick caveat on the receptor science</strong></p><p>Most of the mechanistic work on OTOP1 comes from mice and cell models. The broad picture (protons → dedicated sour cells → aversive &quot;warning&quot; signal) is well supported, but the exact contribution of membrane-permeating weak acids in humans is still debated.</p></aside>
<h2 id="ingredients-that-contribute-acidity">Ingredients that contribute acidity</h2>
<p>The obvious ones are <strong>citrus fruits</strong> and <strong>vinegar</strong>, but your kitchen is likely <em>full</em> of different acids already:</p>
<ul><li>Citrus (citric acid): lemons, limes, oranges, grapefruit (and their zest - which also adds aroma without much acid)</li><li>Vinegars (acetic acid): cider, red/white wine, rice, sherry, balsamic, malt</li><li>Yogurt, kefir, skyr, buttermilk, crème fraîche and soft cheeses (lactic acid)</li><li>Fermented and pickled foods: sauerkraut, kimchi, gherkins, capers, pickled onions/jalapeños (lactic acid for fermented, acetic acid for the vinegars in the pickles)</li><li>Tomatoes and tomato products (citric and malic acid)</li><li>Tamarind, sumac, pomegranate molasses (tartaric → malic → citric acids)</li><li>Berries, rhubarb, green apples, kiwi and unripe stone fruit (citric + malic → malic and oxalic → mostly malic acid → quinic and malic acid → citric, malic and some quinic acid)</li><li>Mustard, ketchup, hot sauce, Worcestershire sauce and most condiments - check the label and you&#39;ll find an acid in nearly all of them</li><li>Wine, cider and beer in cooking</li></ul>
<p><strong>Timing</strong> also matters. </p>
<p>Acids added at the <strong>start</strong> of cooking mellow and integrate into the background.</p>
<p>Acids added at the <strong>end</strong> - a squeeze of lime, a splash of vinegar right before serving - stay bright and noticeable. </p>
<p>Most home cooks only ever do the former, then wonder why restaurant food tastes more &quot;alive&quot;.</p>
<h2 id="acidity-as-balance">Acidity as balance</h2>
<p>Sour is arguably the most versatile balancing tool we have, because it interacts with almost everything:</p>
<p><strong>Acid and sweet.</strong></p>
<p>These two suppress each other - which is why a ripe banana could rescue our sour, bitter protein bowl last time, and why lemonade without sugar is undrinkable while lemonade without lemon is just sugar water. Taste mixture research shows this mutual suppression is consistent, but the size of the effect depends heavily on the concentration of each (<a href="https://doi.org/10.1016/S0950-3293(02)00110-6">Keast &amp; Breslin, 2003</a>). If a dish is cloying, acid is usually the fix; if it&#39;s harsh, sweetness is.</p>
<p><strong>Acid and salt.</strong></p>
<p>This is the relationship most people have never been told about. At <em>low to moderate</em> levels, acid can <strong>enhance</strong> perceived saltiness - but push the acid higher and it starts to suppress it again (<a href="https://doi.org/10.3758/BF03210255">Pangborn &amp; Trabue, 1967</a>). In the other direction, salt sharply reduces perceived sourness, which is why a pinch of salt makes grapefruit taste sweeter, why a salted tomato tastes less sharp than an unsalted one, and ultimately, why margaritas are so addictive.</p>
<p>In practice, a small hit of acid can make a meal taste properly seasoned with <em>less</em> added salt - useful for anyone keeping an eye on sodium or blood pressure. You&#39;ll often hear chefs claim lemon lets you cut salt by 50-75%... although important to note that that figure comes from a citrus industry taste test, not a controlled trial; so take it as encouragement to experiment rather than an evidence-based recommendation.</p>
<p><strong>Acid and richness.</strong></p>
<p>Creamy sauces, cheese, fatty meats, fried food, nut butters - think of the tartare sauce with fish and chips, the pickles in a burger, the vinegar on chips, the lime on tacos or the gherkins next to a cheese board. I find it pretty incredible that every food culture independently arrived at &quot;rich food + something sharp&quot; with their own expression of it. Acid strongly stimulates saliva - citric acid is one of the most potent stimuli we know of (<a href="https://doi.org/10.1016/0003-9969(88)90089-1">Watanabe &amp; Dawes, 1988</a>) - and the contrast seems to &quot;reset&quot; the palate between bites; which is why you&#39;ll commonly find palate cleansing courses or broths on fine dining tasting menus. </p>
<p>(P.s. if you haven&#39;t tried a tasting menu before or get put off by the cost, I highly recommend <strong>Six by Nico</strong> who&#39;s business model is to make it affordable. My wife and I have been about 7 times)</p>
<p><strong>Acid and bitter.</strong></p>
<p>The evidence here is mixed - sometimes acid amplifies bitterness, sometimes it masks it. This is why a bitter salad of rocket or radicchio usually wants a vinaigrette that is <em>balanced</em> with a little honey or mustard rather than just more vinegar. Sweet and salt remain your more reliable tools for bitterness, but if either of those aren&#39;t options for health, dietary or flavour reasons, give acid a go.</p>
<p>Much like sweetness, the &quot;correct&quot; amount of acid is usually only noticeable by its absence. You shouldn&#39;t taste lemon; you should taste a better version of the dish.</p>
<h2 id="acid-in-the-pan-a-little-food-chemistry">Acid in the pan: a little food chemistry</h2>
<p>Acid doesn&#39;t just change taste - it changes the <strong>food itself</strong>. A few rules worth knowing:</p>
<ul><li><strong>Marinades.</strong> Acid lowers the pH of meat, increasing water uptake and reducing toughness in lab measurements - but leave it too long and the surface proteins <em>denature</em> into a mushy, chalky texture. For chicken and pork, 30 minutes to a few hours is plenty; for fish, minutes. A good example of what happens when this is taken to the extreme is <strong>ceviche</strong>, which is simply this taken to its logical conclusion: the acid alters the structure so much that it &quot;<em>cooks</em>&quot; the protein without heat.</li><li><strong>Green vegetables.</strong> Acid swaps the magnesium in chlorophyll for hydrogen, turning vibrant greens a dull olive-brown. Dress your greens, beans and broccoli with acids <em>at the table</em>, not in the pan or the meal-prep box three days earlier if you don&#39;t want ugly veg.</li><li><strong>Firmness.</strong> Acid slows the breakdown of pectin, so vegetables (and, anecdotally, pulses) cooked in acidic liquids stay firmer. Add tomatoes or vinegar to beans <em>after</em> they&#39;re tender if you want them soft.  </li><li><strong>Browning.</strong> A squeeze of lemon on cut apple or avocado slows the browning enzyme - handy for prepped snacks and guacamole.</li><li><strong>Colour changes.</strong> Red cabbage and other anthocyanin-rich foods go a vivid pink-red with acid and blue-green without it. Fun for kids, cool for Instagram.</li></ul>
<h2 id="a-brief-rant-on-apple-cider-vinegar-shots">A brief rant on apple cider vinegar shots...</h2>
<p>If sugar is fitness culture&#39;s villain, apple cider vinegar is its miracle cure. It &quot;melts fat&quot;, &quot;balances hormones&quot;, &quot;detoxes your liver&quot; and, judging by Instagram, can even solve world hunger. But is there any evidence for <em>any</em> of these claims?</p>
<p><strong>Blood Glucose:</strong> this one is reasonably solid. Taking vinegar with a carbohydrate-rich meal modestly reduces the post-meal glucose and insulin response, in a dose-dependent fashion (<a href="https://doi.org/10.1038/sj.ejcn.1602197">Östman et al., 2005</a>), confirmed by meta-analysis (<a href="https://doi.org/10.1016/j.diabres.2017.01.021">Shishehbor et al., 2017</a>). Much of this appears to be because acetic acid <strong>slows gastric emptying</strong> (<a href="https://doi.org/10.1038/sj.ejcn.1600572">Liljeberg &amp; Björck, 1998</a>) - which, by the way, is the same reason it may be unhelpful for people with gastroparesis (<a href="https://doi.org/10.1186/1471-230X-7-46">Hlebowicz et al., 2007</a>). However... unless you&#39;re diabetic, your pancreas works fine and the above will have little to no positive impact on your health.</p>
<p><strong>Appetite:</strong> vinegar <em>can</em> reduce appetite... but partly because it makes people feel <em>nauseous</em>. In one study the least pleasant vinegar drink produced the biggest reduction in appetite, and the authors concluded that promoting vinegar as an appetite suppressant was inappropriate (<a href="https://doi.org/10.1038/ijo.2013.157">Darzi et al., 2014</a>). Making yourself feel a little bit sick isn&#39;t a fat loss strategy I&#39;d recommend...</p>
<p><strong>Fat Loss:</strong> a meta-analysis of 16 trials found improvements in triglycerides and fasting glucose (in type 2 diabetes) but <u><strong>no</strong></u><strong> meaningful effect on BMI or body fat </strong>(<a href="https://doi.org/10.1016/j.jand.2020.12.002">Valdes et al., 2021</a>). And the 2024 trial that went viral for reporting dramatic weight loss from daily apple cider vinegar? It was <strong>retracted</strong> in September 2025 over unreliable data (<a href="https://bmjgroup.com/bmj-group-retracts-trial-on-apple-cider-vinegar-and-weight-loss/">BMJ Group, 2025</a>). If you&#39;ve seen it shared since, you can (smugly) correct them.</p>
<p>So, is vinegar useless? Not at all. But the most useful thing about vinegar is that it makes vegetables, pulses, salads and lean proteins taste fantastic - and <em>that</em> is what moves the needle long term. Having better tasting food <em>can</em> and <em>will</em> help you live a better lifestyle in a healthier body indirectly by your ability to sustain a higher quality diet.</p>
<aside><p><strong>Look after your teeth: Acid and dental erosion</strong></p><p>Frequent acidic drinks - sports drinks, fizzy drinks, citrus juices, neat vinegar shots, sipped lemon water - are associated with higher odds of dental erosion, whereas milk and yoghurt appear protective (<a href="https://doi.org/10.1016/j.jdent.2015.05.012">Salas et al., 2015</a>). Acid <em>in a meal</em> is a very different exposure to sipping it all day.</p>
<p>Practical steps: keep acidic drinks to meals or drink them over a short window rather than sipping, use a straw, rinse with water (or finish with dairy) afterwards, and use fluoride toothpaste (and leave it on - don&#39;t rinse!). The classic advice to wait 30-60 minutes before brushing is now debated - recent reviews suggest fluoride brushing straight after an acid challenge doesn&#39;t significantly increase wear (<a href="https://doi.org/10.1007/s00784-020-03614-9">Hong et al., 2020</a>) - but waiting a little remains a reasonable, cautious habit.</p></aside>
<h2 id="coaching-case-study-if-your-meal-prep-tastes-flat">Coaching case study: if your meal prep tastes &quot;flat&quot;</h2>
<p>This is a pattern I see constantly... </p>
<p>Sunday meal prep: chicken breast, rice, steamed broccoli. Maybe some sweet chilli sauce. By Wednesday, it&#39;s being force fed, and by Thursday a takeaway is &quot;earned&quot;.</p>
<p>The usual instinct is to add <em>more</em> - more sauce, more cheese, more oil, a different protein. Almost always, the meal doesn&#39;t need more calories. <strong>It needs contrast.</strong></p>
<p>This is how you can revise the cardboard classic, keeping the same base and only changing three things:</p>
<ol><li><strong>Marinate</strong> the chicken in yogurt, lemon juice, garlic and spices (lactic and citric acid - plus the yogurt helps it brown and stay juicy).</li><li>A jar of quick-<strong>pickled red onions</strong> - two minutes of effort for a week of crunch and sharpness.</li><li>Leave the broccoli undressed in the box, with a lemon wedge or a splash of vinegar added <em>after</em> reheating, keeping it green and bright.</li></ol>
<p>Same calories (give or take the yogurt). Same macros. But a <em>completely</em> different eating experience. The meal now has <strong>richness</strong> from the yogurt, <strong>sharpness</strong> from the pickles, <strong>freshness</strong> from the lemon and salt doing a supporting role - and adherence goes up because the food is actually <em>enjoyable</em>.</p>
<h2 id="example-recipe-lime-herb-chicken-with-quick-pickles-and-zingy-rice">Example Recipe: Lime &amp; Herb Chicken with Quick Pickles and Zingy Rice</h2>
<p><strong>Makes two decent servings (or one dinner and tomorrow&#39;s lunch)</strong></p>
<h3 id="quick-pickled-onions">Quick Pickled Onions</h3>
<ul><li>1 Red Onion, thinly sliced</li><li>100 mL Cider or Red Wine Vinegar</li><li>100 mL Hot Water</li><li>½ tsp Salt</li><li>1 tsp Honey or Sugar <em>(sweetness to moderate the vinegar - see the last instalment)</em></li></ul>
<p>Mix the liquids, salt and honey until dissolved, pour over the onions in a jar and leave for at least 20 minutes. Keeps in the fridge for 1-2 weeks.</p>
<h3 id="chicken">Chicken</h3>
<ul><li>400 g Chicken Breast or Thigh</li><li>100 g Greek Yogurt or Skyr</li><li>Zest and juice of 1 Lime</li><li>2 cloves Garlic, grated</li><li>1 tsp each of Cumin, Smoked Paprika and Salt</li><li>Black Pepper</li></ul>
<h3 id="to-serve">To serve</h3>
<ul><li>120-200 g Cooked Rice per serving (scaled to training demand)</li><li>A large handful of Greens (Spinach, Broccoli or Green Beans)</li><li>Fresh Coriander or Parsley</li><li>Extra Lime Wedges</li><li>2 tbsp Yogurt mixed with a squeeze of Lime and a pinch of Salt (quick sauce)</li></ul>
<h3 id="method">Method</h3>
<ol><li>Make the pickles first so they&#39;re ready when you are.</li><li>Mix the yogurt, lime zest and juice, garlic, spices and salt. Coat the chicken and marinate for 30 minutes to 4 hours - no longer, or the texture will go mushy.</li><li>Grill, air fry or pan fry the chicken until cooked through and charred in places.</li><li>Cook the greens and keep them undressed until serving.</li><li>Taste a forkful of everything together <em>before</em> adding more lime. Then add it gradually.</li><li>Too sharp? A pinch of salt or a tiny drizzle of honey. Too flat? More lime or a spoonful of the pickling liquid. Too heavy? More pickles.</li></ol>
<p><em>As with last time, I&#39;d encourage you to make a deliberately flat version first, then add acid a little at a time until it &quot;clicks&quot; - and then deliberately overshoot. Learning where that point sits is the skill; the recipe is just the vehicle.</em></p>
<p><strong>The yogurt</strong> provides richness and lactic tang. <strong>The lime</strong> brings fast, bright acidity and aroma. <strong>The pickles</strong> add sharpness and crunch. <strong>Salt</strong> both seasons and keeps the sourness in check. <strong>Honey</strong> moderates the vinegar. The result is contrast in every bite without the need of a calorie dense sauce.</p>
<h2 id="can-acid-help-with-performance-and-health">Can acid help with performance and health?</h2>
<p>Acids can provide a few useful - and evidence-based - bonus points:</p>
<ul><li><strong>Iron Absorption.</strong> Vitamin C markedly increases the absorption of non-haem (plant) iron, roughly in proportion to the dose (<a href="https://doi.org/10.1093/ajcn/30.2.235">Cook &amp; Monsen, 1977</a>), and citric and malic acids appear to contribute too (<a href="https://doi.org/10.1079/bjn19830042">Gillooly et al., 1983</a>). Lemon on your lentils, peppers with your beans or berries with fortified cereals (e.g. Weetabix or Ready Brek) are all great examples - particularly for plant-based, endurance, and menstruating athletes in general.</li><li><strong>Muscle Cramps.</strong> Around 1 ml/kg of pickle juice shortened electrically induced cramps by ~49 seconds compared with water, without changing blood electrolytes (<a href="https://doi.org/10.1249/MSS.0b013e3181c0647e">Miller et al., 2010</a>). The proposed mechanism is a reflex triggered in the mouth and throat which is interesting, but also important to remember this was a small lab study in artificially-induced cramps, not mid-marathon.</li><li><strong>Fermented Foods.</strong> In a 17-week trial, a diet high in fermented foods (yogurt, kefir, kimchi, sauerkraut) increased gut microbiome diversity and reduced several inflammatory markers (<a href="https://doi.org/10.1016/j.cell.2021.06.019">Wastyk et al., 2021</a>). Small study, surrogate outcomes - but a good excuse to keep a jar of kimchi in the fridge.</li></ul>
<aside><p><strong>The Gut Microbiome</strong></p><p>Gut microbiome diversity refers to the variety of different microorganisms living in the gut and how evenly distributed they are within that microbial community.</p>
<p>Greater gut microbiome diversity is generally associated with improved gut resilience, more efficient fibre fermentation, greater production of beneficial metabolites and better regulation of immune and metabolic function.</p></aside>
<h2 id="acidity-and-sustainable-nutrition">Acidity and sustainable nutrition</h2>
<p>Acidity is the cheapest, lowest calorie upgrade available to almost any meal. It costs pennies, contributes virtually no energy and, used well, makes lean proteins, vegetables and wholegrains taste like food you <em>want</em> to eat rather than food you&#39;re <em>supposed</em> to eat.</p>
<p>Again, this is important because the most effective diet is still the one you can <em>stick to</em>.</p>
<p>Sweetness controls the edges.</p>
<p>Acidity brings things to life.</p>
<p>Learn to use both and you&#39;ll find yourself relying far less on &quot;willpower&quot; and far more on skill... which, if you&#39;re a client of mine, you&#39;ll know is exactly where we want to be.</p>
