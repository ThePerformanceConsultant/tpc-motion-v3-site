<h1>How To Eat Out Without Ruining Your Goals</h1>
<p>Will Dyson · <time datetime="2026-07-04T11:45:30.592Z">4 July 2026</time></p>
<p>Something that makes me really sad...

Is people thinking that eating out needs to mean only picking the sad salad at the end of the menu with the inevitable jolt of half-constrained disappointment from their friends/family that couldn&#39;t be hidden by even the strongest willed.
PSA - in all seriou...</p>
<figure><img src="https://cdn.sanity.io/images/stkjtr6l/production/970a260646392a7f9301be087594e314c0c91a86-2560x1850.jpg?w=1280&amp;auto=format&amp;q=75&amp;fit=max" alt="Original cover for How To Eat Out Without Ruining Your Goals" loading="lazy" style="max-width:100%;height:auto" /></figure>
<h2 id="something-that-makes-me-really-sad">Something that makes me really sad...</h2>
<p>Is people thinking that eating out needs to mean only picking the sad salad at the end of the menu with the inevitable jolt of half-constrained disappointment from their friends/family that couldn&#39;t be hidden by even the strongest willed.
<em></em><strong><em>PSA</em></strong><em></em> - <em>in all seriousness, if people judge you for what you eat; fuck them. Eat with other people.</em></p>
<h2 id="but-equally">But, equally...</h2>
<p>Eating out is a <em>privilege</em> and I don&#39;t want you to waste your money on a mirror of your meal prep. IMO, that&#39;s wasteful; not just of your money, but also the one thing you cannot get back...</p>
<h2 id="time">Time.</h2>
<p>In this video, I walk you through <strong>Nando&#39;s</strong> Summer menu in the UK, which I would consider <em>sensible</em> choices and not so sensible choices, but also <strong>why</strong> I have made those distinctions so you can adapt these interpretations to other menus.
I also provide practical notes, calorie targets and adjustments that should suit most people of differing goals that will allow you to have a nice meal, without over-stressing about it being perfect, and without significant compromise of either your experience or your goal progression.
As always, if you struggle with how to navigate particular menus, please <strong>WhatsApp</strong> them to me and I will <strong>traffic light</strong> them for you on a bespoke basis to take the thinking out of it for you and to enhance your learning.
<em>Coach</em></p>
