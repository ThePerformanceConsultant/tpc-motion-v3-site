<h1>The Hidden Benefit of Fibre</h1>
<p>Will Dyson · <time datetime="2026-04-12T13:25:38.513Z">12 April 2026</time></p>
<p>Fibre To Prevent Cardiovascular Disease?!

In general, I think most people are aware that fibre is &quot;good for us&quot;, and in my time coaching, I think this stands true for most aspects of nutrition - we have a general understanding of what is and isn&#39;t good for us, but often haven&#39;t got enough of a c...</p>
<figure><img src="https://cdn.sanity.io/images/stkjtr6l/production/8b2112e0048e6cb818eb4fec3e44a930ae23db69-1500x844.jpg?w=1280&amp;auto=format&amp;q=75&amp;fit=max" alt="Original cover for The Hidden Benefit of Fibre" loading="lazy" style="max-width:100%;height:auto" /></figure>
<h2 id="fibre-to-prevent-cardiovascular-disease">Fibre To Prevent Cardiovascular Disease?!</h2>
<p>In general, I think most people are aware that fibre is &quot;good for us&quot;, and in my time coaching, I think this stands true for most aspects of nutrition - we have a general understanding of what is and isn&#39;t good for us, but often haven&#39;t got enough of a clear picture of the end outcome for things to truly settle in.</p>
<p>I tried to think the other day of the &quot;biggest hitters&quot; when it comes down to making easy and sustainable choices that don&#39;t make our tastebuds want to kill themselves, and <strong>fibre</strong> ranked pretty highly. Today I&#39;m going to talk about one of the lesser known benefits of fibre... in <strong>reducing heart disease risk</strong>.</p>
<p>This feature of fibre is specific to <strong>soluble fibre</strong>. And how it works is pretty simple...</p>
<p>Soluble fibre forms a <strong>gel</strong> in the gut, increasing intestinal content viscosity, which <em>slows</em> the movement of cholesterol through the intestinal wall; meaning less is absorbed. It also reduces <a href="https://pubmed.ncbi.nlm.nih.gov/36796439/"></a><strong><a href="https://pubmed.ncbi.nlm.nih.gov/36796439/">bile acid</a></strong><a href="https://pubmed.ncbi.nlm.nih.gov/36796439/"> resorption</a>. Bile acids are crucial for fat uptake acting kind of like the egg yolks that emulsify mayonnaise, without it, we&#39;d only be able to absorb about 50% of the fats in our diet. Typically &gt;95% is shuttled back to the liver in the ileum and recycled, meaning soluble fibre forces the liver to <strong>use</strong> more cholesterol to replenish bile acids, which it does by pulling more out of our <strong>circulation</strong>. Lastly, it may also increase the production of <strong>short chain fatty acids (SCFAs)</strong> via fermentation from our helpful little gut bacteria friends, partly explaining the link between fibre and the <strong>gut microbiome</strong>. This is especially true for propionate, which may reduce liver cholesterol production.</p>
<p>To give you some numbers, just <a href="https://doi.org/10.1093/ajcn/69.1.30">5-10 grams of soluble fibre per day</a> will typically <strong>lower LDL (&quot;bad&quot;) cholesterol</strong> up to <strong>0.28 mmol/L</strong> - a pretty decent reduction for what, in reality, is a small price to pay. How small a price I hear you ask?</p>
<p>Well, <strong>good sources</strong> of soluble fibre include things oats, beans, legumes (lentils, chickpeas, beans etc.), apples, pears, avocados, carrots, sweet potatoes and many others. 100 grams of (cooked) oats will provide ~0.8 grams, the same weight of chickpeas and beans will provide ~1.6-2.8 grams, and avocado and sweet potato coming in at ~2.3 and ~1.5 grams respectively.</p>
<p><em>Other benefits</em> to soluble fibre intake include helping to improve <strong>blood sugar</strong> control, <strong>increasing fullness</strong> after meals, supporting the <strong>gut microbiome</strong>, and improving <strong>stool consistency</strong>. So even if cholesterol isn’t something you actively think about, you’re still getting plenty of return on investment by getting more of it in.</p>
